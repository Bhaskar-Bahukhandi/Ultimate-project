# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.1.3
  last_upgraded: 2026-09-25

project:
  stage: Concept

modes:
  rigor: full
  automation: guided

engine:
  name: "Godot"
  version: "4.6"
  language: "GDScript"
  rendering: "Forward+"
  physics: "Godot Physics 2D"
  path: "C:/Godot/Godot_v4.6.3-stable_win64.exe"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

# The Godot project lives in AethelgardPrototype/, not the repo root, so every
# command passes --path. build is untested (export templates not verified);
# test runs all 9 suites in ci.yml order (not gdUnit4); add -Quick to skip the
# long chapter-route and phase0 suites.
commands:
  build: '"C:/Godot/Godot_v4.6.3-stable_win64_console.exe" --headless --path AethelgardPrototype --export-debug "Windows Desktop"'
  test: 'powershell -File AethelgardPrototype/tests/run_all_tests.ps1'
  run: '"C:/Godot/Godot_v4.6.3-stable_win64.exe" --path AethelgardPrototype --windowed --resolution 1280x720'
  smoke: '"C:/Godot/Godot_v4.6.3-stable_win64_console.exe" --headless --path AethelgardPrototype --quit-after 5'

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so `/start` asking "what are
# you building?" would stop changing anything. `/start` Phase 3c documents the
# same rule for the file it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.
