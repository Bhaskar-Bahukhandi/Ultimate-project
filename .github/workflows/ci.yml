name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.6.3
  PROJECT_DIR: AethelgardPrototype

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace check (changed lines only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against; skipping."
          else
            git diff --check "$base" HEAD
          fi

      - name: Commit messages (Conventional Commits + Task/Story line)
        run: |
          bash .githooks/test_commit_msg.sh
          # The last commit before the rule (2026-10-18); it and its ancestors aren't checked.
          cutoff=d33ce6679ee8f9478a7c72710e538db4ed4f2423
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$before^{commit}" 2>/dev/null; then
            range="$before..HEAD"
          else
            range="HEAD"   # new branch or force-push: everything after the cutoff
          fi
          not=""
          if git cat-file -e "$cutoff^{commit}" 2>/dev/null; then not="^$cutoff"; fi
          bad=0
          for c in $(git rev-list $range $not); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            if ! bash .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit message: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          exit $bad

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Cache imported assets
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('AethelgardPrototype/**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: ~/godot/godot --headless --path "$PROJECT_DIR" --import || true

      - name: Boot check (fails on any script error)
        run: |
          ~/godot/godot --headless --path "$PROJECT_DIR" --quit-after 120 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error" boot.log; then
            echo "::error::Script errors during boot"
            exit 1
          fi

      - name: Test layout (suites under tests/unit or tests/integration, all run here)
        working-directory: ${{ env.PROJECT_DIR }}
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/meta/test_layout_test.gd

      - name: Load every script and scene
        working-directory: ${{ env.PROJECT_DIR }}
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/project/load_all_test.gd

      - name: Dialogue format tests (parser, runner, every .dlg file)
        working-directory: ${{ env.PROJECT_DIR }}
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/dialogue/dialogue_test.gd

      - name: ContextStack tests (pause, menus, time scale)
        working-directory: ${{ env.PROJECT_DIR }}
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/core/context_stack_test.gd

      - name: Input tests (bindings, rebinding, prompts, gamepad)
        working-directory: ${{ env.PROJECT_DIR }}
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/input/input_test.gd

      - name: Chapter 1 route (rewritten dialogue, end to end)
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 15
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/story/chapter1_route_test.gd

      - name: Chapter 2 route (rewritten dialogue, end to end)
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 15
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/story/chapter2_route_test.gd

      - name: Combat fixes (time-zone speed, placeholder flip, top-down motion)
        working-directory: ${{ env.PROJECT_DIR }}
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/combat/combat_fixes_test.gd

      - name: Reachability (collision never walls off an NPC, shop, gate or trigger)
        working-directory: ${{ env.PROJECT_DIR }}
        run: GODOT=~/godot/godot bash tests/run_tests.sh res://tests/integration/level/reachability_test.gd

      - name: Phase 0 regression tests
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 30
        run: GODOT=~/godot/godot bash tests/run_tests.sh 2>&1 | tee phase0.log; exit "${PIPESTATUS[0]}"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            boot.log
            ${{ env.PROJECT_DIR }}/phase0.log
          if-no-files-found: ignore
